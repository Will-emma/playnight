<nav>
  <div>
    <img src="assets/takima-logo.png" routerLink="" />
    <mat-nav-list>
      @for (link of links; track link) {
      <a mat-list-item routerLink="{{ link.href }}" routerLinkActive="active">
        <span>{{ link.name }}</span>
      </a>
      }
    </mat-nav-list>
    <button
      class="theme-toggle"
      type="button"
      [attr.aria-pressed]="!themeService.darkMode"
      [attr.aria-label]="themeService.darkMode ? 'Passer au mode clair' : 'Passer au mode sombre'"
      (click)="themeService.basculer()"
    >
      <span class="theme-toggle__icon" aria-hidden="true">{{ themeService.darkMode ? "☼" : "☾" }}</span>
      <span class="theme-toggle__label">{{ themeService.darkMode ? "Mode clair" : "Mode sombre" }}</span>
    </button>
  </div>
</nav>
