version: '3.1'
services:
  database:
    container_name: playnight_database
    image: postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER : ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      # Les scripts SQL sont exécutés automatiquement à la création de la base
      # Un volume existant n'est pas réinitialisé ; sa suppression efface les données.
      - ./initdb:/docker-entrypoint-initdb.d
