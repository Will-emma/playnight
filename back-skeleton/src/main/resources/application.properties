# Lit automatiquement le fichier .env (DATABASE_USER, DATABASE_PASSWORD, DATABASE_NAME) au démarrage,
# que l'appli soit lancée depuis back-skeleton/ ou depuis la racine du projet.
# Les variables d'environnement déjà définies (ex. dans la CI) restent prioritaires.
spring.config.import=optional:file:.env[.properties],optional:file:back-skeleton/.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Import de jeux vidéo depuis l'API RAWG (bonus 4). La clé se met dans le .env (RAWG_API_KEY=...).
# Facultative : sans clé, l'appli et la CI démarrent normalement, seul l'import renvoie une erreur.
rawg.api-key=${RAWG_API_KEY:}
rawg.url=https://api.rawg.io/api

# Photos personnelles : dossier durable, extérieur au code et aux assets Angular.
# En conteneur, monter AVATAR_STORAGE_DIR sur un volume persistant.
playnight.avatars.directory=${AVATAR_STORAGE_DIR:./uploads/avatars}
# URL publique de l'API, utilisée par tous les DTO et les pages affichant un joueur.
playnight.public-api-url=${PUBLIC_API_URL:http://localhost:8080}
