# Lit automatiquement le fichier .env (DATABASE_USER, DATABASE_PASSWORD, DATABASE_NAME) au démarrage,
# que l'appli soit lancée depuis back-skeleton/ ou depuis la racine du projet.
# Les variables d'environnement déjà définies (ex. dans la CI) restent prioritaires.
spring.config.import=optional:file:.env[.properties],optional:file:back-skeleton/.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB